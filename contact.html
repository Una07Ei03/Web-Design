<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ClinkNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-title">
            <img src="./images/Logo.jpeg" alt="ClinkNote Logo">
            <h1 class="logo-title">ClinkNote</h1>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="security.html">Security</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 100px 10%; min-height: 80vh;">
        <h2>Contact Us</h2>
        <p>For patent licensing inquiries or technical support, please fill out the form below.</p>
        
        <form style="display: flex; flex-direction: column; max-width: 500px; gap: 15px; margin-top: 20px;">
            <label>Name:</label>
            <input type="text" name="name" placeholder="Your Name" required>
            
            <label>Email:</label>
            <input type="email" name="email" placeholder="Your Email" required>
            
            <label>Subject:</label>
            <select name="subject">
                <option value="general">General Inquiry</option>
                <option value="patent">Patent Licensing</option>
                <option value="support">Technical Support</option>
            </select>
            
            <label>Message:</label>
            <textarea name="message" rows="5" placeholder="How can we help?"></textarea>
            
            <button type="submit" style="padding: 10px; background: #070225; color: white; cursor: pointer;">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ClinkNote Inc. All Rights Reserved.</p>
    </footer>
</body>
</html>
