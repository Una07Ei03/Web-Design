<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ClinkNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-title">
            <img src="./images/Logo.jpeg" alt="ClinkNote Logo">
            <h1 class="logo-title">ClinkNote</h1>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="security.html">Security</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <h2>Contact Us</h2>
        <p>For patent licensing inquiries or technical support, please fill out the form below.</p>
    
        <form id="contactForm" class="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your Full Name" required>
        
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="example@clinknote.com" required>
        
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g., +353 912 345 678">

            <button type="submit" class="submit-btn">Send Message</button>
        </form>

        <p style="font-size: 12px; color: gray; margin-top: 10px;">
            * Your inquiry is protected by end-to-end encryption to ensure IP confidentiality.
        </p>
    </main>

    <footer>
        <p>&copy; 2026 ClinkNote Inc. All Rights Reserved.</p>
    </footer>
</body>
</html>
